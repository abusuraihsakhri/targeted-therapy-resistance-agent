name: Targeted Therapy Resistance Engine CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[server,test]"

    - name: Run Pytest Suite
      env:
        AUDIT_SECRET_KEY: ci-test-audit-secret-key-2026
      run: |
        pytest -v

    - name: Check browser JavaScript regression suite
      run: |
        node --check web/app.js
        node --test tests/web.test.cjs

    - name: Validate static entrypoint and package CLI
      run: |
        python -m compileall -q agents targeted_therapy_resistance_agent
        targeted-therapy-resistance-engine audit --case-id SYNTH-CI --primary 10 --secondary 5 --status NORMAL
        test -f index.html
        test -f web/index.html

    - name: Security SAST & Zero-PHI Audit
      env:
        AUDIT_SECRET_KEY: ci-test-audit-secret-key-2026
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
