[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "targeted-therapy-resistance-engine"
version = "2.0.0"
description = "Resistome Sentinel: Cancer Targeted Therapy Secondary Resistance Mechanism Arbiter"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "targeted_therapy_resistance_agent*"]

[project.scripts]
targeted-therapy-resistance-engine = "targeted_therapy_resistance_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/targeted-therapy-resistance-agent"
Repository = "https://github.com/abusuraihsakhri/targeted-therapy-resistance-agent.git"
